services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yiyuanju}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yiyuanju}
      POSTGRES_DB: ${POSTGRES_DB:-yiyuanju}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yiyuanju}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
